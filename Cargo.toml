[package]
name = "ui-tg"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A colorless, command-driven terminal graph navigator"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
unicode-width = "0.2"
